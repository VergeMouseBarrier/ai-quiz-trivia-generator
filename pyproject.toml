[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ai-quiz-trivia-generator"
version = "0.4.2"
description = "Desktop AI-powered quiz and trivia generator for Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "quizgen contributors" }]
keywords = ["quiz", "trivia", "ai", "llm", "desktop", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "jinja2>=3.1",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "respx>=0.21",
]

[project.scripts]
quizgen = "quizgen.bootstrap.cli:main"
quizgen-gui = "quizgen.bootstrap.gui:main"

[project.urls]
Homepage = "https://github.com/quizgen/ai-quiz-trivia-generator"
Issues = "https://github.com/quizgen/ai-quiz-trivia-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["quizgen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"